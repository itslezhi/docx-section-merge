name: Finalize latest skill source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize.yml'
      - '.parts/**'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify remaining scripts
        shell: bash
        run: |
          set -euo pipefail
          cat .parts/part.* > /tmp/remaining-scripts.tar.gz.b64
          base64 -d /tmp/remaining-scripts.tar.gz.b64 > /tmp/remaining-scripts.tar.gz
          echo '9c0658dc388968839e7ca337944c541853087ff1d69a0b98c9f8fac1cf731f29  /tmp/remaining-scripts.tar.gz' | sha256sum -c -
          tar -xzf /tmp/remaining-scripts.tar.gz -C scripts
          echo '3fca644752cf98423d6ec7b36c44a2988f32164a722c9755431541c25a7ca2b9  scripts/run_regression.py' | sha256sum -c -
          echo 'c9a072f68d5b5f68e0d1906189d9a3ccefeab3bc7ac449a38d0a5215459eaccd  scripts/style_firewall.py' | sha256sum -c -
          echo '9c0dede77e0f51d2750981bf0e56da56d677453d1e936a49f2e07710f115a99e  scripts/template_writer.py' | sha256sum -c -
          echo '0e229b48c4fedfc6d5363e9b8b1b35d5f961ee9816ac3635860b19fac1f37f99  scripts/audit_template_format.py' | sha256sum -c -
          echo '93e1d2d0b58c33654522faead00f61cd5ff2cd548d1a1a0de37db50afdc4275b  scripts/merge_integrity.py' | sha256sum -c -

      - name: Commit clean repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .parts .github/workflows/finalize.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m 'Publish latest docx-section-merge skill'
          git push origin HEAD:main
