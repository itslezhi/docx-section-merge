name: Publish skill package
on:
  push:
    paths:
      - '.github/workflows/publish-skill.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct package
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/payload.* > /tmp/package.b64
          base64 -d /tmp/package.b64 > /tmp/docx-section-merge.zip
          echo "a8616b80ab901c15b2281dda4d17531eb6f4f73cceec14aa4540e95099f1c87c  /tmp/docx-section-merge.zip" | sha256sum -c -
          mkdir /tmp/unpack
          unzip -q /tmp/docx-section-merge.zip -d /tmp/unpack

      - name: Publish clean repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish-clean
          git rm -rf . || true
          cp -a /tmp/unpack/docx-section-merge/. .
          git add -A
          git commit -m "Publish docx-section-merge skill"
          git push --force origin HEAD:main

# Retriggered to publish the verified latest package.
